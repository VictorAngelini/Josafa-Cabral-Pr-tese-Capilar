kind = "web"
previewPath = "/"
title = "Josafá - Hair & Prótese Capilar"
version = "1.0.0"
id = "artifacts/josafa-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21220

[services.development]
run = "pnpm --filter @workspace/josafa-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/josafa-site", "run", "build" ]
publicDir = "artifacts/josafa-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21220"
BASE_PATH = "/"
